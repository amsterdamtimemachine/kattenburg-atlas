name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set source cache generation
        id: build-settings
        run: echo "cache-epoch=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore IIIF derivatives
        uses: actions/cache@v6
        with:
          path: .container-cache/iiif
          key: container-iiif-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            container-iiif-v1-${{ runner.os }}-

      - name: Restore remote annotations
        uses: actions/cache@v6
        with:
          path: .container-cache/annotations
          key: container-annotations-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            container-annotations-v1-${{ runner.os }}-

      - name: Restore thumbnails and sources
        uses: actions/cache@v6
        with:
          path: .container-cache/thumbnails
          key: container-thumbnails-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            container-thumbnails-v1-${{ runner.os }}-

      # BuildKit cache mounts need explicit import/export on hosted runners.
      - name: Persist iiif build cache
        uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
        with:
          cache-source: .container-cache/iiif
          cache-target: /app/apps/slides/.svelte-kit/iiif
          scratch-dir: .container-cache/scratch-iiif

      - name: Persist annotations build cache
        uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
        with:
          cache-source: .container-cache/annotations
          cache-target: /app/apps/slides/.svelte-kit/annotations
          scratch-dir: .container-cache/scratch-annotations

      - name: Persist thumbnails build cache
        uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
        with:
          cache-source: .container-cache/thumbnails
          cache-target: /app/apps/slides/.svelte-kit/thumbnails
          scratch-dir: .container-cache/scratch-thumbnails

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            SLIDES_REF=${{ vars.SLIDES_REF || 'main' }}
            PUBLIC_BASE_PATH=${{ vars.CONTAINER_BASE_PATH }}
            PUBLIC_URL=${{ vars.CONTAINER_PUBLIC_URL }}
            CACHE_EPOCH=${{ steps.build-settings.outputs.cache-epoch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kattenburg-site
          cache-to: type=gha,mode=max,scope=kattenburg-site
