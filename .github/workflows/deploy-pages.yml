name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v4

      - name: Clone slides source
        env:
          SLIDES_REF: ${{ vars.SLIDES_REF || 'main' }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/allmaps/slides.git slides-source
          git -C slides-source sparse-checkout init --no-cone
          git -C slides-source sparse-checkout set --no-cone "/*" "!/content/" "!/content/**"
          git -C slides-source checkout "$SLIDES_REF"

      - name: Link content package
        run: |
          rm -f slides-source/content
          ln -s ../content slides-source/content

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: slides-source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: slides-source
        run: pnpm install --frozen-lockfile

      - name: Check public configuration
        env:
          PUBLIC_PROTOMAPS_KEY: ${{ vars.PUBLIC_PROTOMAPS_KEY }}
        run: |
          if [ -z "$PUBLIC_PROTOMAPS_KEY" ]; then
            echo "::warning title=Missing PUBLIC_PROTOMAPS_KEY::Set PUBLIC_PROTOMAPS_KEY as a repository variable to enable Protomaps tiles."
          fi

      - name: Build static site
        working-directory: slides-source
        run: pnpm exec slides build --config ../slides.config.yml

      - name: Disable Jekyll processing
        working-directory: slides-source
        run: touch apps/slides/build/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides-source/apps/slides/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
