name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_iiif_cache:
        description: Delete existing IIIF derivative caches before building
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out slides
        uses: actions/checkout@v7
        with:
          repository: allmaps/slides
          ref: ${{ vars.SLIDES_REF || 'main' }}
          sparse-checkout: |
            /*
            !/content/
            !/content/**
          sparse-checkout-cone-mode: false

      - name: Check out content
        uses: actions/checkout@v7
        with:
          path: content/${{ github.event.repository.name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache IIIF derivatives
        id: iiif-cache
        uses: actions/cache@v6
        with:
          path: apps/slides/.svelte-kit/iiif
          key: iiif-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            iiif-${{ runner.os }}

      - name: Delete previous cache
        run: gh cache delete iiif-${{ runner.os }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build static site
        env:
          CONTENT_PATH: content/${{ github.event.repository.name }}
        run: |
          package_name="$(jq -r '.name // empty' "$CONTENT_PATH/package.json")"

          if [ -z "$package_name" ]; then
            echo "::error::Missing package name in $CONTENT_PATH/package.json"
            exit 1
          fi

          pnpm exec slides build "$package_name"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/slides/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
