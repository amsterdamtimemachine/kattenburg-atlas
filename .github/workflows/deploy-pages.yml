name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_iiif_cache:
        description: Regenerate IIIF derivatives without restoring their cache
        required: false
        default: false
        type: boolean
      reset_annotations_cache:
        description: Re-fetch remote georeference annotations
        required: false
        default: false
        type: boolean
      reset_thumbnails_cache:
        description: Regenerate thumbnails and their source cache
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out slides
        uses: actions/checkout@v7
        with:
          repository: allmaps/slides
          ref: ${{ vars.SLIDES_REF || 'main' }}
          sparse-checkout: |
            /*
            !/content/
            !/content/**
          sparse-checkout-cone-mode: false

      - name: Check out content
        uses: actions/checkout@v7
        with:
          path: content/${{ github.event.repository.name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install headless map rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libopengl0 libglx0 libcurl4t64 libjpeg-turbo8 libuv1t64 libx11-6 libxext6 libwebp7 libicu74 libpng16-16t64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test app and native camera alignment
        env:
          SLIDES_TEST_NATIVE: "true"
        run: xvfb-run -a pnpm --filter @allmaps/slides test

      - name: Restore IIIF derivatives
        if: ${{ !inputs.reset_iiif_cache }}
        id: iiif-cache
        uses: actions/cache/restore@v6
        with:
          path: apps/slides/.svelte-kit/iiif
          key: iiif-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            iiif-${{ runner.os }}

      - name: Restore remote annotations
        if: ${{ !inputs.reset_annotations_cache }}
        uses: actions/cache/restore@v6
        with:
          path: apps/slides/.svelte-kit/annotations
          key: annotations-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            annotations-v1-${{ runner.os }}-

      - name: Restore thumbnails and map sources
        if: ${{ !inputs.reset_thumbnails_cache }}
        uses: actions/cache/restore@v6
        with:
          path: apps/slides/.svelte-kit/thumbnails
          key: thumbnails-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            thumbnails-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build static site
        id: build-static-site
        env:
          CONTENT_PATH: content/${{ github.event.repository.name }}
          PUBLIC_BASE_PATH: ${{ github.event.repository.name }}
        run: |
          package_name="$(jq -r '.name // empty' "$CONTENT_PATH/package.json")"

          if [ -z "$package_name" ]; then
            echo "::error::Missing package name in $CONTENT_PATH/package.json"
            exit 1
          fi

          xvfb-run -a pnpm exec slides build "$package_name"

      - name: Save IIIF derivatives
        uses: actions/cache/save@v6
        with:
          path: apps/slides/.svelte-kit/iiif
          key: iiif-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save remote annotations
        uses: actions/cache/save@v6
        with:
          path: apps/slides/.svelte-kit/annotations
          key: annotations-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save thumbnails and map sources
        uses: actions/cache/save@v6
        with:
          path: apps/slides/.svelte-kit/thumbnails
          key: thumbnails-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/slides/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
